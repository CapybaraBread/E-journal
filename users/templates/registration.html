{%load static%}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный журнал</title>
    <link rel="stylesheet" href="{% static 'css/registration.css' %}">
  </head>
  <main>
    <div class="registration_content">
      <h1>Регистрация</h1>
      <form action="{% url 'registration' %}" method="post">
        {% csrf_token %}
        <p class="form_text">Полное ФИО</p>{{form.fio}}
        <p class="form_text">Логин</p>{{form.username}}
        <p class="form_text">Пароль</p>{{form.password1}}
        <p class="form_text">Повторить пароль</p>{{form.password2}}
        <button type="submit">Зарегистрироваться</button>
        <a class="url_avtor" href="{% url 'login' %}">Есть аккаунт?</a>
        {% if form.errors %}
            <label>{{form.errors}}</label>
        {%endif%}
      </form>
    </div>
  </main>
</html>
